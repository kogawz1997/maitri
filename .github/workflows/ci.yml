name: CI / CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Lint & Type-check ──────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci --prefer-offline

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

  # ── 2. Build (with demo/placeholder env vars) ─────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    env:
      # Supabase — placeholder so Next.js build passes without real project
      NEXT_PUBLIC_SUPABASE_URL: https://demo-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.PLACEHOLDER
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.SERVICE_PLACEHOLDER
      # AI
      ANTHROPIC_API_KEY: sk-ant-placeholder-for-ci-build-only
      # App URL
      NEXT_PUBLIC_APP_URL: https://maitri-preview.vercel.app
      # Additional required vars
      CRON_SECRET: demo_cron_secret_placeholder
      WHATSAPP_APP_SECRET: demo_whatsapp_secret_placeholder
      IMMIGRATION_API_KEY: demo_immigration_placeholder
      OMISE_WEBHOOK_SECRET: demo_omise_webhook_placeholder
      ETAX_USERNAME: demo@etax.placeholder.com
      ETAX_PASSWORD: demo_etax_placeholder
      FLOWACCOUNT_API_KEY: demo_flowaccount_placeholder
      PEAK_API_KEY: demo_peak_placeholder
      # Payment (placeholder — won't charge anything)
      OMISE_PUBLIC_KEY: pkey_test_placeholder
      OMISE_SECRET_KEY: skey_test_placeholder
      OMISE_WEBHOOK_SECRET: webhook_placeholder
      # Messaging (placeholder)
      LINE_CHANNEL_ACCESS_TOKEN: line_placeholder
      LINE_CHANNEL_SECRET: line_secret_placeholder
      WHATSAPP_ACCESS_TOKEN: wa_placeholder
      WHATSAPP_PHONE_NUMBER_ID: "0000000000"
      WHATSAPP_VERIFY_TOKEN: verify_placeholder
      SENDGRID_API_KEY: SG.placeholder
      SENDGRID_FROM_EMAIL: noreply@placeholder.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci --prefer-offline

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: .next
          retention-days: 1

  # ── 3. Deploy preview to Vercel (PR only) ────────────────────────────
  preview:
    name: Vercel Preview Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel (preview)
        id: deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./

  # ── 4. Deploy production (main branch only) ───────────────────────────
  deploy:
    name: Vercel Production Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://maitri.vercel.app
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel (production)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: --prod
          working-directory: ./
